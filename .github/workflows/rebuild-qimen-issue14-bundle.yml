name: rebuild-qimen-issue14-bundle

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/rebuild-qimen-issue14-bundle.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.repository == 'hhszzzz/taibu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Build and verify the qimen fix
        run: |
          pnpm -C packages/core build
          node --test packages/core/tests/qimen-core.test.mjs packages/core/tests/regression-audit-fixes.test.mjs
          pnpm exec eslint packages/core/src/domains/qimen/calculate.ts packages/core/tests/qimen-core.test.mjs
      - name: Rebuild the offline bundle
        run: |
          node scripts/build-skill-bundle.mjs
          git diff --check
          git diff --exit-code -- skills/taibu-divination/SKILL.md skills/taibu-divination/references
      - name: Commit only the regenerated bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- skills/taibu-divination/scripts/vendor/taibu-core.bundle.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'chore(qimen): regenerate offline bundle for issue 14'
          git push origin HEAD:master
