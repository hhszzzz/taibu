# Production overlay. Load with compose.base.yml:
#   docker compose --env-file /opt/taibu/env/compose.env \
#     -f deploy/compose.base.yml -f deploy/compose.prod.yml up -d
# compose.env holds only non-secret interpolation: LOCAL_PROJECT,
# LOCAL_INSTANCE_ID, APP_DOMAIN, TAIBU_IMAGE, TAIBU_TAG.
services:
  caddy:
    # Pinned by digest so an upstream tag move cannot change the edge unseen.
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # Hosts that already run a system Caddy (like hw) use EDGE_MODE=host and
    # never start this service; `--profile edge` opts in explicitly.
    profiles: ["edge"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ADMIN_IP: ${ADMIN_IP:-127.0.0.1}   # space separated CIDR list
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /opt/taibu/maintenance:/srv/maintenance:ro
    networks: [edge]
    mem_limit: 96m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    labels: { io.taibu.local.instance: "${LOCAL_INSTANCE_ID:?}" }
  web:
    networks: [edge, backend]
    environment:
      NODE_OPTIONS: --max-old-space-size=448
      DB_POOL_MAX: "10"
    mem_limit: 640m
    stop_grace_period: 30s
  worker:
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      DB_POOL_MAX: "6"
      AGENT_WORKER_CONCURRENCY: "2"
    mem_limit: 512m
  db:
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    mem_limit: 640m
    shm_size: 256m
  redis:
    mem_limit: 160m
  # Weekly drill helper: same image as web, read-only access to the dumps.
  # Not started by `up`; the entrypoint is node, so pass the script explicitly:
  #   docker compose … run --rm restore-check scripts/db/verify-restore.mjs \
  #     --backup /backups/taibu-daily-YYYYMMDD.dump
  restore-check:
    image: ${TAIBU_IMAGE:?}:${TAIBU_TAG:?}
    profiles: ["tools"]
    restart: "no"
    # Dumps are 0600 root on the volume; the image runs as uid 100.
    user: "0:0"
    env_file: ["${TAIBU_ENV_DIR:?}/restore.env"]
    entrypoint: ["node"]
    volumes:
      - backups:/backups:ro
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    env_file: ["${TAIBU_ENV_DIR:?}/backup.env"]
    volumes:
      - backups:/backups
      - files:/data/files:ro
    networks: [backend]
    mem_limit: 128m
    depends_on:
      db: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    labels: { io.taibu.local.instance: "${LOCAL_INSTANCE_ID:?}" }
volumes:
  caddy_data: {}
  caddy_config: {}
  backups: {}
networks:
  edge: {}
