# Production overlay. Load with compose.base.yml:
#   docker compose --env-file /opt/taibu/env/compose.env \
#     -f deploy/compose.base.yml -f deploy/compose.prod.yml up -d
# compose.env holds only non-secret interpolation: LOCAL_PROJECT,
# LOCAL_INSTANCE_ID, APP_DOMAIN, TAIBU_IMAGE, TAIBU_TAG.
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ADMIN_IP: ${ADMIN_IP:-127.0.0.1}   # space separated CIDR list
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /opt/taibu/maintenance:/srv/maintenance:ro
    networks: [edge]
    mem_limit: 96m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    labels: { io.taibu.local.instance: "${LOCAL_INSTANCE_ID:?}" }
  web:
    networks: [edge, backend]
    environment:
      NODE_OPTIONS: --max-old-space-size=448
      DB_POOL_MAX: "10"
    mem_limit: 640m
    stop_grace_period: 30s
  worker:
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      DB_POOL_MAX: "6"
      AGENT_WORKER_CONCURRENCY: "2"
    mem_limit: 512m
  db:
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    mem_limit: 640m
    shm_size: 256m
  redis:
    mem_limit: 160m
  backup:
    build: ./backup
    restart: unless-stopped
    env_file: ["${TAIBU_ENV_DIR:?}/backup.env"]
    volumes:
      - backups:/backups
      - files:/data/files:ro
    networks: [backend]
    mem_limit: 128m
    depends_on:
      db: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    labels: { io.taibu.local.instance: "${LOCAL_INSTANCE_ID:?}" }
volumes:
  caddy_data: {}
  caddy_config: {}
  backups: {}
networks:
  edge: {}
