# Opt-in only: run via `node scripts/selfhost.mjs`, never with an ambient .env.
name: ${LOCAL_PROJECT:?Run selfhost init first}
x-ownership: &ownership
  io.taibu.local.instance: ${LOCAL_INSTANCE_ID:?}
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}
x-node: &node
  image: node:24.21.0-alpine3.23
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging: *logging
  labels: *ownership
  networks: [backend]
services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: taibu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    # Local-only loopback for `pnpm db:codegen` and DB contract tests.
    ports: ['127.0.0.1:${DB_HOST_PORT:-54329}:5432']
    volumes: [database:/var/lib/postgresql/data]
    networks: [backend]
    logging: *logging
    labels: *ownership
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d taibu']
      interval: 2s
      timeout: 3s
      retries: 60
  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    labels: *ownership
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${APP_ORIGIN:?}/auth/v1
      GOTRUE_SITE_URL: ${APP_ORIGIN:?}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?}@db:5432/taibu
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '0'
      GOTRUE_LOG_LEVEL: error
  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    labels: *ownership
    environment:
      PGRST_DB_URI: postgres://authenticator:${REST_DB_PASSWORD:?}@db:5432/taibu
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: '3000'
      PGRST_LOG_LEVEL: crit
  storage:
    image: supabase/storage-api:v1.33.0
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    labels: *ownership
    volumes: [storage:/var/lib/storage]
    environment:
      ANON_KEY: ${ANON_KEY:?}
      SERVICE_KEY: ${SERVICE_KEY:?}
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      AUTH_JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgres://supabase_storage_admin:${STORAGE_DB_PASSWORD:?}@db:5432/taibu
      DATABASE_SEARCH_PATH: storage
      DB_INSTALL_ROLES: 'false'
      POSTGREST_URL: http://rest:3000
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: '52428800'
      TENANT_ID: local
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: 'false'
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    labels: *ownership
    volumes: [redis:/data]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
  functions:
    image: taibu-vector-function:local
    build:
      context: ./supabase/functions/create-vector-index
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    labels: *ownership
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?}
      SUPABASE_DB_URL: postgres://taibu_vector_owner:${VECTOR_DB_PASSWORD:?}@db:5432/taibu
  web:
    image: taibu-web:local
    build:
      context: .
      args:
        SUPABASE_PUBLIC_URL: ${APP_ORIGIN:?}
        SELF_HOSTED: 'true'
    restart: unless-stopped
    networks: [backend, egress]
    logging: *logging
    labels: *ownership
    volumes: [files:/data/files]
    environment: &application-env
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      APP_ORIGIN: ${APP_ORIGIN:?}
      SELF_HOSTED: 'true'
      AUTH_ALLOW_INSECURE_LOCAL_HTTP: 'true'
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${APP_ORIGIN:?}
      SUPABASE_ANON_KEY: ${ANON_KEY:?}
      SUPABASE_SECRET_KEY: ${SERVICE_KEY:?}
      SUPABASE_SYSTEM_ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      SUPABASE_SYSTEM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      NEWAPI_API_KEY: ${DEMO_API_KEY:?}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AGENT_MCP_SERVERS: ${AGENT_MCP_SERVERS:-}
      AGENT_CREDENTIAL_ENCRYPTION_KEY: ${AGENT_CREDENTIAL_ENCRYPTION_KEY:-}
      DATABASE_URL: postgres://taibu_app:${APP_DB_PASSWORD:?}@db:5432/taibu
      DB_POOL_MAX: '10'
      DB_APPLICATION_NAME: taibu-web
      SYSTEM_USER_ID: ${SYSTEM_USER_ID:-}
      FILE_STORAGE_DRIVER: local
      FILE_STORAGE_ROOT: /data/files
  worker:
    image: taibu-web:local
    restart: unless-stopped
    networks: [backend, egress]
    logging: *logging
    labels: *ownership
    volumes: [files:/data/files]
    environment:
      <<: *application-env
      AGENT_WORKER_CONCURRENCY: '2'
      DB_POOL_MAX: '6'
      DB_APPLICATION_NAME: taibu-worker
    command: [node, .agent/worker.mjs]
    healthcheck:
      test: [CMD, node, .agent/worker.mjs, --health]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  gateway:
    <<: *node
    networks: [backend, ingress]
    user: node
    read_only: true
    ports: ['127.0.0.1:${APP_PORT:?}:8000']
    volumes: ['./scripts/selfhost/gateway.mjs:/app/gateway.mjs:ro']
    command: [node, /app/gateway.mjs]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?}
  demo:
    <<: *node
    profiles: [demo]
    user: node
    read_only: true
    volumes: ['./scripts/selfhost/demo.mjs:/app/demo.mjs:ro']
    command: [node, /app/demo.mjs]
    environment:
      DEMO_API_KEY: ${DEMO_API_KEY:?}
  maintenance:
    <<: *node
    profiles: [tools]
    restart: 'no'
    volumes: [storage:/storage]
    command: ['true']
  maintenance-attributes:
    image: supabase/storage-api:v1.33.0
    profiles: [tools]
    restart: 'no'
    network_mode: none
    user: '0:0'
    read_only: true
    security_opt: [no-new-privileges:true]
    labels: *ownership
    # Output is a private backup sidecar, not an application diagnostic log.
    logging: {driver: none}
    volumes:
      - storage:/storage
      - ./scripts/selfhost/storage-attributes.cjs:/helper/storage-attributes.cjs:ro
    entrypoint: [node, /helper/storage-attributes.cjs]
    command: []
volumes:
  database:
    labels: *ownership
  storage:
    labels: *ownership
  files:
    labels: *ownership
  redis:
    labels: *ownership
networks:
  backend:
    internal: true
    labels: *ownership
  ingress:
    labels: *ownership
  egress:
    labels: *ownership
