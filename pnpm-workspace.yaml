packages:
  - .
  - 'packages/*'
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# pdfjs-dist only supplies the CMap and standard font data that unpdf reads; text extraction renders nothing.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
# @capacitor/cli reads native project plists through plist 3.1, which locks @xmldom/xmldom 0.8.11;
# 0.8.15 fixes its serialization injection and quadratic parsing advisories.
overrides:
  '@xmldom/xmldom@<0.8.15': ^0.8.15
